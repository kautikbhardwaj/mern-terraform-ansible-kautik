---
- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"
  become: true

- name: Add NodeSource apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/nodesource.asc]
      https://deb.nodesource.com/node_{{ nodejs_major_version }}.x nodistro main
    filename: nodesource
    state: present
    update_cache: true
  become: true

- name: Install Node.js and NPM
  ansible.builtin.apt:
    name: nodejs
    state: present
  become: true

- name: Report installed Node.js and NPM versions
  ansible.builtin.command: "{{ item }} --version"
  register: node_versions
  changed_when: false
  loop:
    - node
    - npm

- name: Show Node.js and NPM versions
  ansible.builtin.debug:
    msg: "node {{ node_versions.results[0].stdout }} / npm v{{ node_versions.results[1].stdout }}"

- name: Install PM2 globally
  community.general.npm:
    name: pm2
    global: true
    state: present
  become: true

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
  become: true

- name: Ensure Nginx is running and enabled
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
  become: true
